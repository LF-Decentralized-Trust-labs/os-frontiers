name: CI Workflow

on:
  push:
    branches: [ main, feature/*, cursor/** ]
  pull_request:

jobs:
  test-evaluator-and-integrity:
    name: Run Evaluator, Link Checks, & Integrity Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify DCO sign-off on the pull request range
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            git fetch origin "${GITHUB_BASE_REF}"
            RANGE="origin/${GITHUB_BASE_REF}..HEAD"
          elif git rev-parse --verify origin/main >/dev/null 2>&1; then
            RANGE="origin/main..HEAD"
          else
            RANGE="HEAD"
          fi
          missing=0
          while IFS= read -r sha; do
            [ -z "$sha" ] && continue
            if ! git log -1 --format=%B "$sha" | grep -q '^Signed-off-by: '; then
              echo "Missing Signed-off-by on $sha"
              git log -1 --oneline "$sha"
              missing=1
            fi
          done < <(git log "$RANGE" --no-merges --format=%H)
          if [ "$missing" -ne 0 ]; then
            echo "DCO check failed. Sign commits with git commit -s."
            exit 1
          fi
          echo "DCO sign-off present on non-merge commits in ${RANGE}."

      - name: Verify Markdown Links Integrity
        run: |
          python -c "
          import os, re, sys
          link_pattern = re.compile(r'\[([^\]]+)\]\(([^)]+)\)')
          broken = []
          for root, dirs, files in os.walk('.'):
              if '.git' in root or 'node_modules' in root: continue
              for f in files:
                  if f.endswith('.md'):
                      filepath = os.path.join(root, f)
                      with open(filepath, 'r', encoding='utf-8') as file:
                          content = file.read()
                      for match in link_pattern.finditer(content):
                          label, url = match.group(1), match.group(2)
                          if url.startswith('http') or url.startswith('mailto:') or url.startswith('#'): continue
                          clean_url = url.split('#')[0]
                          if not clean_url: continue
                          target_path = os.path.normpath(os.path.join(root, clean_url))
                          if not os.path.exists(target_path):
                              broken.append((filepath, url, target_path))
          if broken:
              print(f'❌ Broken links found: {len(broken)}')
              for b in broken:
                  print(f'  {b[0]} -> {b[1]}')
              sys.exit(1)
          print('✅ All markdown relative links verified successfully.')
          "

      - name: Install schema checker
        run: |
          python -m pip install 'jsonschema>=4.18'

      - name: Run Unit Tests for Evaluator Engine
        run: |
          python -m unittest discover -s evaluator/tests -v

      - name: Run Python Evaluator Assessor with Sample Config
        run: |
          python evaluator/cli/assess_ecosystem.py evaluator/examples/sample_input_config.json

      - name: Run QUAID Scanner Adapter from the saved fixture
        run: |
          python evaluator/cli/quaid_adapter.py --fixture evaluator/fixtures/quaid_cardano_node.json intersectmbo/cardano-node

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Lint the front-door markdown
        run: |
          npx --yes markdownlint-cli2@0.17.2

      - name: Test Node Evaluator CLI with Sample Config
        run: |
          node evaluator/cli/index.js ./evaluator/examples/sample_input_config.json

      - name: Verify local preview HTML structure
        run: |
          node -e "
          const fs = require('fs');
          const html = fs.readFileSync('evaluator/preview/index.html', 'utf8');
          if (!html.includes('id=\"tab-dospo\"') || !html.includes('eval-indicator-15')) {
              console.error('❌ Local preview HTML structure validation failed.');
              process.exit(1);
          }
          console.log('✅ Local preview HTML structure verified.');
          "
