[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "os-frontiers-evaluator"
version = "0.8.0-rc.1"
description = "Automated 3-Piece Ecosystem Assessor CLI (dOSPO, OMF, ORF)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "OSF Lab contributors" },
]
dependencies = []

[project.optional-dependencies]
schema = ["jsonschema>=4.18"]

[project.scripts]
os-frontiers-assess = "assess_ecosystem:main"

[tool.setuptools]
py-modules = ["assess_ecosystem", "quaid_adapter"]

[tool.setuptools.package-dir]
"" = "cli"
